<!doctype html><html><head><meta charset="utf-8"><title>Handoff colours</title>
<style>
body{background:#1a1a1a;color:#ddd;font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif;padding:24px;margin:0}
h1{font-size:16px;font-weight:600;margin:0 0 18px}
.v{margin-bottom:22px}.name{font-size:12px;color:#999;margin:0 0 6px 4px}
.wrap{background:#222;border-radius:14px;padding:12px;max-width:1100px}
.bar{position:relative;display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 14px;overflow:hidden;border:1px solid var(--edge);background:var(--bg)}
.art{position:absolute;inset:0;background:
 repeating-linear-gradient(-70deg,transparent 0 60px,rgba(255,255,255,.035) 60px 64px,transparent 64px 120px),
 radial-gradient(circle at 92% 50%,color-mix(in srgb,var(--glow) 30%,transparent),transparent 40%),
 linear-gradient(90deg,transparent 43%,color-mix(in srgb,var(--c) 16%,transparent) 62%,color-mix(in srgb,var(--c) 34%,transparent) 85%,color-mix(in srgb,var(--glow) 48%,transparent));}
.art:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) .7px,transparent .8px);background-size:6px 6px;-webkit-mask:linear-gradient(90deg,transparent 43%,#000 70%)}
.words{position:relative;flex:1;min-width:0}
.t{color:var(--c);font-weight:700}.d{color:#8a8a92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{position:relative;display:flex;gap:10px;align-items:center;flex-shrink:0}
.b{padding:4px 10px;border-radius:7px;color:#eee}.sel{background:rgba(255,255,255,.1)}.dim{color:#aaa}
.k{font-size:11px;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:0 4px;margin-left:6px;color:#999}
.sl{border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 10px;color:#eee}
.go{background:#fff;color:#111;border-radius:7px;padding:4px 12px;font-weight:600}.x{color:#bbb}
</style></head><body><h1>Handoff bar: colour variants</h1>
<script>
const V=[
['A · Brand purple (now)','#a79cf7','#15121f','#4a3f80','#b3a6ff'],
['B · Teal, "passing on"','#5fd4c4','#0d1a19','#2a6560','#8ff0e2'],
['C · Rose','#f07ab8','#1c0f17','#6b2f52','#ffa6d6'],
['D · Gold','#e8c46a','#1a160c','#6a5523','#ffe39a'],
['E · Electric blue','#7f9cff','#0f1222','#33427f','#a9bcff'],
['F · Graphite, white accent','#e6e6ea','#141416','#45454d','#ffffff'],
['G · Purple to teal (brand blend)','#a79cf7','#121522','#3f4f80','#5fd4c4'],
];
for(const [n,c,bg,edge,glow] of V){document.write(`<div class="v"><p class="name">${n}</p><div class="wrap"><div class="bar" style="--c:${c};--bg:${bg};--edge:${edge};--glow:${glow}"><div class="art"></div><div class="words"><div class="t">⇥ Handoff</div><div class="d">Done in seconds. Clears chat, carries on.</div></div><div class="ctl"><span class="b sel">Quick<span class="k">Q</span></span><span class="b dim"><span class="k">F</span> Full</span><span class="sl">Clear &amp; carry on ⌄</span><span class="go">Go</span><span class="x">✕</span></div></div></div></div>`)}
</script></body></html>
