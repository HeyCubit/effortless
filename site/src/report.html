<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a bug · effortless</title>
<meta name="description" content="Tell us what went wrong in effortless. Opens a prefilled GitHub issue.">
<link rel="canonical" href="https://heycubit.github.io/effortless/report/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="effortless">
<meta property="og:title" content="Report a bug in effortless">
<meta property="og:description" content="Tell us what went wrong. Opens a prefilled GitHub issue.">
<meta property="og:url" content="https://heycubit.github.io/effortless/report/">
<meta property="og:image" content="https://heycubit.github.io/effortless/og.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="effortless: picks the reasoning effort for every prompt in Claude Code">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Report a bug in effortless">
<meta name="twitter:description" content="Tell us what went wrong. Opens a prefilled GitHub issue.">
<meta name="twitter:image" content="https://heycubit.github.io/effortless/og.png">
<meta name="theme-color" content="#121214">
<link rel="icon" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500&display=swap" rel="stylesheet">
<style>

/* Report a bug: a short form that opens a prefilled GitHub issue. No backend; GitHub holds the report. */
:root{--page:#121214;--text:#ececef;--muted:#9a9aa4;--dim:#82828c;--accent:#a79cf7;--sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;--display:Outfit,Inter,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{max-width:760px;margin:0 auto;padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.name{display:inline-flex;align-items:center;gap:10px;font:500 23px var(--display);letter-spacing:-.01em;text-decoration:none}
.name .spark{width:44px;height:44px;margin:-8px -3px -8px -8px}
.back{color:var(--muted);text-decoration:none;font-size:15.5px}
.back:hover{color:var(--text)}
main{max-width:760px;margin:0 auto;padding:72px 24px 96px}
h1{margin:0;font:500 clamp(30px,4vw,42px)/1.1 var(--display);letter-spacing:-.02em;color:#f4f2ff}
form{margin-top:32px;display:grid;gap:18px}
label{display:grid;gap:8px;color:#d4d4d8;font-weight:500;font-size:14.5px}
label small{color:var(--dim);font-weight:400}
input,textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:10px;background:#1b1a21;color:var(--text);font:15px/1.5 var(--sans)}
textarea{min-height:180px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6e6d78}
input:focus,textarea:focus{outline:none;border-color:#a79cf780;background:#1f1e26}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.go{justify-self:start;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border:0;border-radius:10px;background:#f4f3f8;color:#141218;font:600 15px var(--sans);cursor:pointer}
.go:hover{background:#fff}
.go svg{width:18px;height:18px}
.note{margin:-6px 0 0;color:var(--dim);font-size:13.5px}
a:focus-visible,.go:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
@media (max-width:560px){.top{padding:16px 16px 0}main{padding:48px 16px 72px}.opt{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a class="name" href="../">__SPARK__effortless</a>
  <a class="back" href="../">Back to the site</a>
</header>
<main>
  <h1>Report a bug</h1>
  <form id="report">
    <label>What went wrong<input name="title" required maxlength="140" placeholder="The bar stays on Deciding after a prompt"></label>
    <label>What happened<textarea name="body" required placeholder="What you did, what you expected, and what you saw instead."></textarea></label>
    <div class="opt">
      <label><span>effortless version <small>optional</small></span><input name="effortless" placeholder="__LATEST__" autocomplete="off"></label>
      <label><span>Claude Code version <small>optional</small></span><input name="cc" placeholder="claude --version" autocomplete="off"></label>
    </div>
    <button class="go" type="submit">__GITHUB__Open the issue on GitHub</button>
    <p class="note">Opens a prefilled GitHub issue in a new tab. You need a GitHub account, and the report lives there.</p>
  </form>
</main>
<script>
// The mod's Settings link can pass ?effortless=1.36.0&cc=2.1.300; those fill the optional fields.
var f=document.getElementById('report'),q=new URLSearchParams(location.search);
['effortless','cc'].forEach(function(k){if(q.get(k))f.elements[k].value=q.get(k).slice(0,40)});
f.addEventListener('submit',function(e){e.preventDefault();
  var v=function(k){return f.elements[k].value.trim()},body=v('body'),ver=[];
  if(v('effortless'))ver.push('- effortless: '+v('effortless'));
  if(v('cc'))ver.push('- Claude Code: '+v('cc'));
  if(ver.length)body+='\n\n### Versions\n'+ver.join('\n');
  window.open('https://github.com/HeyCubit/effortless/issues/new?title='+encodeURIComponent(v('title'))+'&body='+encodeURIComponent(body),'_blank','noopener');
});
</script>
</body>
</html>
