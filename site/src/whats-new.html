<style>
/* What's new: a plain list, newest first, from releases.json. */
:root{--page:#121214;--text:#ececef;--muted:#9a9aa4;--dim:#82828c;--accent:#a79cf7;--sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;--display:Outfit,Inter,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{max-width:760px;margin:0 auto;padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.name{display:inline-flex;align-items:center;gap:10px;font:500 23px var(--display);letter-spacing:-.01em;text-decoration:none}
.name .spark{width:44px;height:44px;margin:-8px -3px -8px -8px}
.back{color:var(--muted);text-decoration:none;font-size:15.5px}
.back:hover{color:var(--text)}
main{max-width:760px;margin:0 auto;padding:72px 24px 96px}
h1{margin:0;font:500 clamp(30px,4vw,42px)/1.1 var(--display);letter-spacing:-.02em;color:#f4f2ff}
/* Each release is a bar, drawn like the mod's dashboard: the dark band, the grey art on the right, the mark, then the
   version in the effort word's place, the note, and the date. The newest version is violet. */
.rel{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:10px}
.rel li{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px 10px 14px;border-radius:10px;background:#141416;border:1px solid #2a2a2f;color:#d4d4d8;font-size:15px;line-height:1.4}
.rel li:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(30% 140% at 89% 50%,#9a9aa21d,transparent),linear-gradient(90deg,transparent 43%,#9a9aa210 62%,#9a9aa223 85%,#9a9aa231),repeating-linear-gradient(110deg,transparent 0 46px,#ffffff09 46px 49px,transparent 49px 88px),radial-gradient(#ffffff12 .5px,transparent .7px) 0 0/4px 4px;-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000 75%);mask-image:linear-gradient(90deg,transparent 40%,#000 75%)}
.rel li>*{position:relative}
.rel .spark{width:20px;height:20px;flex-shrink:0;margin-right:-4px}
.rel .v{flex-shrink:0;min-width:4.6em;font-weight:650;font-variant-numeric:tabular-nums}
.rel li:first-child .v{color:#9b7bff}
.rel .n{flex:1;min-width:0}
.rel time{flex-shrink:0;color:#8b8b93;font-size:13.5px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.rel li{flex-wrap:wrap;row-gap:2px}.rel .n{flex-basis:100%;order:3;padding-left:30px}.rel time{margin-left:auto}}
.more{margin-top:6px}
.more summary{cursor:pointer;color:var(--muted);font-size:14px}
.more summary:hover{color:var(--text)}
.more .rel{margin-top:10px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media (max-width:560px){.top{padding:16px 16px 0}main{padding:48px 16px 72px}}
</style>
</head>
<body>

</body>
